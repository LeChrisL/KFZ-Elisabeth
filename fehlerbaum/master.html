<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fehlerbaum – Masteransicht</title>
<style>
  :root {
    --symptom: #26323A; --ursache: #F6D04D; --station: #2A9D8F; --lehrkraft: #E8533A;
    --u: min(1vw, 1.75vh);
    --papier: #F7F5F0; --tinte: #1d2327;
  }
  * { box-sizing: border-box; }
  html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--papier); color: var(--tinte);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  body { display: flex; flex-direction: column; }

  /* Werkzeugleiste */
  #leiste { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px;
    background: #fff; border-bottom: 1px solid #ddd; font-size: 14px; }
  #leiste .titel { font-weight: 600; margin-right: 8px; }
  @media (max-width: 1500px) { #leiste .titel { display: none; } #leiste { font-size: 13px; } #leiste button { padding: 4px 8px; } }
  #leiste button, #leiste select { font: inherit; padding: 5px 10px; border: 1px solid #c9c9c9; border-radius: 6px; background: #fff; cursor: pointer; }
  #leiste button:hover { background: #f0f0f0; }
  #leiste button.aktiv { background: var(--station); color: #fff; border-color: var(--station); }
  #leiste .gruppe { display: inline-flex; gap: 0; }
  #leiste .gruppe button { border-radius: 0; margin-left: -1px; }
  #leiste .gruppe button:first-child { border-radius: 6px 0 0 6px; }
  #leiste .gruppe button:last-child { border-radius: 0 6px 6px 0; }
  #leiste .rechts { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  #code { font-family: ui-monospace, Consolas, monospace; font-size: 18px; letter-spacing: 2px; background: #eef6f5; padding: 2px 8px; border-radius: 6px; }
  #status { font-size: 13px; }
  #status::before { content: "●"; margin-right: 4px; }
  #status.verbunden::before { color: #2a9d48; }
  #status.getrennt::before, #status.fehler::before { color: #d33; }
  #zaehler { font-size: 13px; color: #555; }
  #zeigeLeiste { position: fixed; top: 6px; right: 6px; z-index: 5; display: none; opacity: .35; border: 1px solid #aaa; background: #fff; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  #zeigeLeiste:hover { opacity: 1; }
  body.ohneLeiste #leiste { display: none; }
  body.ohneLeiste #zeigeLeiste { display: block; }

  /* Baum */
  #baum { flex: 1; padding: calc(var(--u) * 1.6) calc(var(--u) * 2); background: var(--papier); min-height: 0; position: relative; }
  #baum.tafel { display: grid; grid-template-columns: 40fr 4fr 56fr; gap: calc(var(--u) * 1); }
  .spalte { display: flex; flex-direction: column; gap: calc(var(--u) * 1.1); min-height: 0; }
  .mittelpfeil { display: flex; align-items: center; justify-content: center; font-size: calc(var(--u) * 5); color: #c6c6c6; transition: color .3s; }
  .mittelpfeil.an { color: var(--tinte); }

  .karte { border-radius: calc(var(--u) * .8); box-shadow: 0 2px 6px rgba(0,0,0,.12); padding: calc(var(--u) * 1.1) calc(var(--u) * 1.4); line-height: 1.2; }

  .symptom { background: var(--symptom); color: #fff; text-align: center; }
  .symptom .haupt { font-size: calc(var(--u) * 3.2); font-weight: 700; }
  .symptom .detail { font-size: calc(var(--u) * 1.9); opacity: .85; margin-top: calc(var(--u) * .3); }

  .check { font-size: calc(var(--u) * 2.2); font-weight: 600; cursor: pointer; user-select: none; color: #3a3a3a; font-family: "Segoe Print", "Chalkboard SE", "Comic Sans MS", sans-serif; }
  .check .kasten { display: inline-block; width: 1.2em; }
  .check.an { color: #2a7d48; }

  .raster { display: grid; gap: calc(var(--u) * 1); }
  .ursache { background: var(--ursache); font-size: calc(var(--u) * 2.15); font-weight: 600; text-align: center; cursor: pointer; user-select: none; position: relative; display: flex; align-items: center; justify-content: center; min-height: calc(var(--u) * 6.5); }
  .ursache.weg { opacity: .55; }
  .ursache.weg::after { content: ""; position: absolute; inset: 8% 4%;
    background: linear-gradient(to top right, transparent calc(50% - 3px), #222 calc(50% - 3px), #222 calc(50% + 3px), transparent calc(50% + 3px)),
                linear-gradient(to top left,  transparent calc(50% - 3px), #222 calc(50% - 3px), #222 calc(50% + 3px), transparent calc(50% + 3px)); }
  .ursache.kreis { outline: calc(var(--u) * .45) solid #c62828; outline-offset: calc(var(--u) * .35); border-radius: 50% / 40%; }
  .hinweis { font-size: calc(var(--u) * 2); font-family: "Segoe Print", "Chalkboard SE", "Comic Sans MS", sans-serif; color: #333; text-align: center; visibility: hidden; }
  .hinweis.an { visibility: visible; }
  .zweig { background: #5E7280; color: #fff; flex-direction: column; }
  #baum.tafel .zweig { font-size: calc(var(--u) * 1.75); min-height: calc(var(--u) * 5); padding: calc(var(--u) * .5) calc(var(--u) * .8); }
  #baum.tafel .ursache:not(.zweig) { min-height: calc(var(--u) * 5); font-size: calc(var(--u) * 1.95); padding: calc(var(--u) * .5) calc(var(--u) * .8); }
  #baum.tafel .spalte { gap: calc(var(--u) * .9); }
  .zweig .klein { display: block; font-size: .72em; font-weight: 500; opacity: .9; margin-top: .15em; }
  .zweig.weg::after { filter: invert(1); }
  .ursache.leerkarte.zweig { border-color: #9aa8b1; color: #7d8c96; }
  .ursache.leerkarte { background: transparent; border: 2px dashed #c9b25a; box-shadow: none; color: #b39a3c; font-weight: 500; font-size: calc(var(--u) * 1.4); }
  .ursache.frei { font-style: italic; }

  /* Auswahl der Ursachen (ZFG) */
  #auswahl { position: fixed; inset: 0; background: rgba(20,25,30,.55); z-index: 20; display: none; align-items: center; justify-content: center; }
  #auswahl.an { display: flex; }
  #auswahl .panel { background: #fff; border-radius: 14px; padding: 18px 20px; width: min(560px, 94vw); max-height: 92vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.3); font-size: 17px; }
  #auswahl h3 { margin: 0 0 12px; font-size: 19px; }
  #auswahl .liste { display: grid; gap: 8px; }
  #auswahl .liste button { font: inherit; font-size: 19px; font-weight: 600; text-align: left; padding: 12px 14px; border-radius: 10px; border: 2px solid #e2c84a; background: #F6D04D; cursor: pointer; }
  #auswahl .liste button .nr { display: inline-block; width: 1.6em; color: #7a6510; }
  #auswahl .liste.zurueck button { background: #fff; border-color: #ddd; font-weight: 500; font-size: 15px; padding: 8px 12px; color: #555; }
  #auswahl .eigen { display: flex; gap: 8px; margin-top: 12px; }
  #auswahl .eigen input { flex: 1; font: inherit; font-size: 18px; padding: 10px; border: 2px solid #ccc; border-radius: 10px; }
  #auswahl .eigen button, #auswahl .unten button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
  #auswahl .klein { font-size: 13px; color: #777; margin: 14px 0 6px; }
  #auswahl .unten { display: flex; justify-content: flex-end; margin-top: 14px; }

  .station { background: var(--station); color: #fff; cursor: pointer; user-select: none; display: flex; flex-direction: column; gap: calc(var(--u) * .5); min-height: calc(var(--u) * 9); }
  .station .kopf { font-size: calc(var(--u) * 1.45); opacity: .9; display: flex; justify-content: space-between; gap: 8px; }
  .station .zeile { font-size: calc(var(--u) * 2.3); font-weight: 600; line-height: 1.25; }
  .station.zwei { gap: calc(var(--u) * .3); padding-top: calc(var(--u) * .8); padding-bottom: calc(var(--u) * .8); }
  .station.zwei .zeile { font-size: calc(var(--u) * 1.5); line-height: 1.2; }
  .station.zwei .luecke.voll { border-bottom-width: 2px; }
  .station .zeile .tisch { display: inline-block; font-size: .6em; font-weight: 700; background: rgba(255,255,255,.25); border-radius: 4px; padding: 0 .35em; margin-right: .4em; vertical-align: middle; }
  .station .luecke.voll { border-bottom: 3px solid rgba(255,255,255,.85); padding: 0 .15em; }
  .station .luecke.leer { opacity: .5; }
  .station .wahl { opacity: .55; font-weight: 500; }
  .station .wahl.an { opacity: 1; font-weight: 700; }
  .station .wartet { font-size: calc(var(--u) * 1.6); opacity: .65; font-style: italic; }
  .station .verdeckt { font-size: calc(var(--u) * 1.7); background: rgba(255,255,255,.18); border: 2px dashed rgba(255,255,255,.7); border-radius: 8px; padding: .25em .5em; animation: pulsieren 1.6s ease-in-out infinite; }
  @keyframes pulsieren { 50% { background: rgba(255,255,255,.32); } }
  .station .zeile + .zeile, .station .zeile + .wartet, .station .wartet + .zeile, .station .verdeckt + .zeile, .station .zeile + .verdeckt { margin-top: calc(var(--u) * .3); }

  .kette { display: flex; align-items: center; gap: calc(var(--u) * 1.2); }
  .kette .pf { font-size: calc(var(--u) * 3); color: #444; }
  .lehrkraft { background: var(--lehrkraft); color: #fff; font-size: calc(var(--u) * 2.4); font-weight: 700; flex: 1; text-align: center; cursor: pointer; user-select: none; min-height: calc(var(--u) * 6.5); display: flex; align-items: center; justify-content: center; }
  .lehrkraft.zu { background: transparent; color: #b9b9b9; border: 2px dashed #cfcfcf; box-shadow: none; font-weight: 500; font-size: calc(var(--u) * 1.6); }
  .kette .pf.zu { color: #ddd; }
  .kette.lang { gap: calc(var(--u) * .6); }
  .kette.lang .lehrkraft { font-size: calc(var(--u) * 1.55); min-height: calc(var(--u) * 6); padding: calc(var(--u) * .5); }
  .kette.lang .lehrkraft.zu { font-size: calc(var(--u) * 1.2); }
  .kette.lang .pf { font-size: calc(var(--u) * 2); }

  .stationen-raster { flex: 1; min-height: 0; }

  /* Klassischer Fehlerbaum (wie auf dem Arbeitsblatt): Ebenen von oben nach unten, Linien als SVG.
     Größen richten sich nach der Fläche des Baums (Container-Einheiten), damit alles auf den Beamer passt. */
  #baum.klassisch { display: flex; flex-direction: column; justify-content: space-between; container-type: size; padding-top: 1.2vh; padding-bottom: 1.2vh; }
  #linien { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
  #linien path { fill: none; stroke: #4a4a4a; stroke-width: 3; stroke-linejoin: round; }
  #linien path.blass { stroke: #cfcfcf; stroke-dasharray: 8 7; stroke-width: 2.5; }
  .kz { --u: min(1vw, 1.6vh); }
  @supports (container-type: size) { .kz { --u: min(1cqw, 1.72cqh); } }
  .kz { display: grid; grid-template-columns: calc(var(--u) * 15) 1fr; align-items: center; position: relative; z-index: 1; }
  .kz + .kz { margin-top: calc(var(--u) * 2.4); }
  .kz.nurlabel .klabel { grid-column: 1 / -1; }
  .klabel .check { font-size: calc(var(--u) * 1.7); white-space: nowrap; }
  .kinhalt { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.8); }
  .kreihe { display: flex; justify-content: center; align-items: flex-start; gap: calc(var(--u) * 1.3); width: 100%; }
  .kzelle { flex: 1; display: flex; flex-direction: column; align-items: stretch; max-width: calc(var(--u) * 26); }
  .klassisch .symptom { padding: calc(var(--u) * .8) calc(var(--u) * 4); }
  .klassisch .symptom .haupt { font-size: calc(var(--u) * 2.5); }
  .klassisch .symptom .detail { font-size: calc(var(--u) * 1.5); }
  .klassisch .ursache { font-size: calc(var(--u) * 1.6); min-height: calc(var(--u) * 5.2); padding: calc(var(--u) * .6); }
  .klassisch .hinweis { display: none; align-self: center; margin-top: calc(var(--u) * 2); background: #fff; border: 2px solid #4a4a4a; border-radius: calc(var(--u) * .5);
    padding: calc(var(--u) * .25) calc(var(--u) * .8); font-size: calc(var(--u) * 1.35); white-space: nowrap; position: relative; z-index: 1; }
  .klassisch .hinweis.an { display: block; visibility: visible; }
  .klassisch .kreihe.st .kzelle { max-width: none; }
  .klassisch .station { min-height: calc(var(--u) * 7); padding: calc(var(--u) * .8) calc(var(--u) * 1.1); }
  .klassisch .station .kopf { font-size: calc(var(--u) * 1.25); }
  .klassisch .station .zeile { font-size: calc(var(--u) * 1.75); }
  .klassisch .station.zwei .zeile { font-size: calc(var(--u) * 1.35); }
  .klassisch .station .verdeckt, .klassisch .station .wartet { font-size: calc(var(--u) * 1.3); }
  .klassisch .lkspalte { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.8); }
  .klassisch .lkreihe { gap: calc(var(--u) * 2.6); align-items: stretch; }
  .klassisch .lkreihe .kzelle { max-width: calc(var(--u) * 24); }
  .klassisch .lehrkraft { flex: 1; min-height: calc(var(--u) * 5); font-size: calc(var(--u) * 1.6); padding: calc(var(--u) * .5) calc(var(--u) * .9); }
  .klassisch .lehrkraft.zu { font-size: calc(var(--u) * 1.3); }

  /* Beim Bildexport keine Bedienhinweise */
  body.export .lehrkraft.zu, body.export .station .verdeckt { visibility: hidden; }
  body.export #linien path.blass, body.export .leerkarte { visibility: hidden; }

  #meldung { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #meldung.an { opacity: .92; }
  #fehler { padding: 40px; font-size: 20px; color: #a00; }

  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    #leiste, #zeigeLeiste, #meldung { display: none !important; }
    html, body { height: auto; background: #fff; }
    #baum { --u: 3.5mm; height: 190mm; background: #fff; }
    .karte { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .lehrkraft.zu, .station .verdeckt, #linien path.blass { visibility: hidden; }
  }
</style>
</head>
<body>
<div id="leiste">
  <span class="titel" id="titel">Fehlerbaum</span>
  <span>Ansicht:</span>
  <span class="gruppe" id="layoutWahl"><button data-layout="klassisch">Baum</button><button data-layout="tafel">Tafel</button></span>
  <span>Tische:</span>
  <span class="gruppe" id="tischWahl"></span>
  <button id="btnQR" title="QR-Codes für die Gruppenkarten">QR-Codes</button>
  <button id="btnTest" title="Beispielkarten aller Stationen senden">Testdaten</button>
  <button id="btnBild" title="Fehlerbaum als PNG-Bild speichern">Bild speichern</button>
  <button id="btnDruck" title="Drucken oder als PDF speichern">PDF/Drucken</button>
  <button id="btnVoll">Vollbild</button>
  <button id="btnAus" title="Leiste ausblenden (Taste L)">Leiste aus</button>
  <span class="rechts">
    <span id="zaehler"></span>
    <span>Code <span id="code">…</span></span>
    <span id="status">verbinde …</span>
    <button id="btnNeu" title="Neue Sitzung für die nächste Klasse">Neue Sitzung</button>
  </span>
</div>
<button id="zeigeLeiste" title="Leiste einblenden (Taste L)">☰</button>
<div id="baum"></div>
<div id="meldung"></div>

<script src="js/einstellungen.js"></script>
<script src="js/gemeinsam.js"></script>
<script src="js/verbindung.js"></script>
<script src="lib/html-to-image.js"></script>
<script>
(async function () {
  "use strict";
  const baumId = fb.param("baum", "ventiltrieb");
  const ich = fb.instanzId();
  let baum;
  try { baum = await fb.ladeBaum(baumId); }
  catch (e) { document.getElementById("baum").outerHTML = "<div id='fehler'>" + fb.esc(e.message) + "</div>"; return; }
  fb.farbenSetzen(baum);
  document.getElementById("titel").textContent = baum.titel;
  document.title = "Fehlerbaum – " + baum.titel;

  // ---------- Sitzung ----------
  let code = fb.param("s", "");
  const letzteSchl = "fb-letzte-sitzung-" + baumId;
  if (!code) {
    try {
      const l = JSON.parse(localStorage.getItem(letzteSchl) || "null");
      if (l && Date.now() - l.zeit < 10 * 3600 * 1000) code = l.code; // innerhalb von 10 h weiterführen
    } catch (e) {}
  }
  if (!code) code = fb.neuerCode();
  localStorage.setItem(letzteSchl, JSON.stringify({ code, zeit: Date.now() }));
  const url = new URL(location.href); url.searchParams.set("baum", baumId); url.searchParams.set("s", code);
  history.replaceState(null, "", url);
  document.getElementById("code").textContent = code;

  // ---------- Zustand ----------
  const stBlock = fb.stationen(baum);
  const tische = stBlock.tische || ["A"];
  const zustandSchl = "fb-zustand-" + code;
  // Startansicht: aus der Konfiguration ("startansicht": "A", "B" oder "alle"), sonst alle Tische
  const startAnsicht = stBlock.startansicht || (tische.length > 1 ? "alle" : tische[0]);
  const startLayout = baum.layout || "klassisch";
  const LEER = () => ({ ursachen: {}, freigabe: {}, lehrkraft: {}, checks: {}, aufgedeckt: [], freitext: {}, ansicht: startAnsicht, layout: startLayout });
  let zustand = LEER();
  try { Object.assign(zustand, JSON.parse(localStorage.getItem(zustandSchl) || "{}")); } catch (e) {}
  const karten = {}; // "s2A" -> {werte, zeit}

  const verb = fbVerbindung(code);
  const statusEl = document.getElementById("status");
  verb.status((s, t) => {
    statusEl.className = s;
    statusEl.textContent = s === "verbunden" ? (verb.art === "lokal" ? "lokal (nur dieser Browser)" : "verbunden") : (t || s);
    if (s === "fehler") melde(t);
  });

  let sendeTimer = null;
  function zustandGeaendert() {
    localStorage.setItem(zustandSchl, JSON.stringify(zustand));
    zeichnen();
    clearTimeout(sendeTimer);
    // kurz sammeln, damit schnelles Antippen nicht viele Nachrichten erzeugt
    sendeTimer = setTimeout(() => verb.senden({ t: "zustand", von: ich, z: zustand }).catch(() => {}), 500);
  }

  verb.abonnieren(n => {
    if (!n || !n.t) return;
    if (n.t === "karte") {
      const k = fb.schluessel(n.st, n.tisch);
      karten[k] = { werte: n.werte || {}, zeit: n.zeit || Date.now() };
      zeichnen();
    } else if (n.t === "zustand" && n.von !== ich && n.z) {
      // Zustand einer früheren Masteransicht (z. B. nach Neuladen oder zweites Gerät)
      zustand = Object.assign(LEER(), n.z);
      localStorage.setItem(zustandSchl, JSON.stringify(zustand));
      zeichnen();
    }
  });

  // ---------- Zeichnen ----------
  const baumEl = document.getElementById("baum");

  // Ursachen-Plätze: Bei "aufdecken": true starten alle leer und werden in der Reihenfolge des ZFG gefüllt.
  const uBlock = baum.bloecke.find(x => x.typ === "ursachen");
  function ursachenText(id) {
    if (zustand.freitext[id]) return zustand.freitext[id];
    const k = uBlock && uBlock.karten.find(x => x.id === id);
    return k ? k.text : "";
  }
  function ursachenPlaetze(b) {
    if (!b.aufdecken) return b.karten.map(k => ({ id: k.id, text: k.text }));
    const n = b.karten.length + (b.leer || 0);
    const auf = zustand.aufgedeckt.filter(id => ursachenText(id));
    const p = auf.map(id => ({ id, text: ursachenText(id), frei: !!zustand.freitext[id] }));
    // Sobald eine Ursache eingekreist ist, ist das Eingrenzen fertig: leere Plätze verschwinden
    const fertig = auf.some(id => zustand.ursachen[id] === "kreis");
    if (!fertig) while (p.length < Math.max(n, auf.length)) p.push({ leer: true });
    return p;
  }
  const zBlock = baum.bloecke.find(x => x.typ === "zweige");
  function zweigHTML(k, b, klassisch) {
    const e = fb.esc;
    const sichtbar = !b.aufdecken || zustand.aufgedeckt.includes(k.id);
    const kn = klassisch ? " data-knoten='z-" + e(k.id) + "'" : "";
    if (!sichtbar) return "<div class='karte ursache zweig leerkarte' data-zweigslot='" + e(k.id) + "'" + kn + " data-zustand='leer'" + (k.weiter ? " data-weiter='1'" : "") + ">?</div>";
    const s = zustand.ursachen[k.id] || "";
    return "<div class='karte ursache zweig " + s + "' data-ursache='" + e(k.id) + "'" + kn + " data-zustand='" + s + "'" + (k.weiter ? " data-weiter='1'" : "") + ">" +
      e(k.text) + (k.detail ? "<span class='klein'>" + e(k.detail) + "</span>" : "") + "</div>";
  }
  function leerHTML(knoten) { return "<div class='karte ursache leerkarte' data-slot='1'" + (knoten ? " data-knoten='u-leer' data-zustand='leer'" : "") + ">?</div>"; }

  function zeichneBlock(b) {
    const e = fb.esc;
    switch (b.typ) {
      case "symptom":
        return "<div class='karte symptom'><div class='haupt'>" + e(b.text) + "</div>" + (b.detail ? "<div class='detail'>" + e(b.detail) + "</div>" : "") + "</div>";
      case "zweige":
        return "<div class='raster' style='grid-template-columns:repeat(" + b.karten.length + ",1fr)'>" + b.karten.map(k => zweigHTML(k, b, false)).join("") + "</div>";
      case "check": {
        const an = !!zustand.checks[b.id];
        return "<div class='check" + (an ? " an" : "") + "' data-check='" + e(b.id) + "'><span class='kasten'>" + (an ? "☑" : "☐") + "</span>" + e(b.text) + "</div>";
      }
      case "ursachen": {
        let kreis = false;
        const h = ursachenPlaetze(b).map(k => {
          if (k.leer) return leerHTML(false);
          const s = zustand.ursachen[k.id] || "";
          if (s === "kreis") kreis = true;
          return "<div class='karte ursache " + s + (k.frei ? " frei" : "") + "' data-ursache='" + e(k.id) + "'>" + e(k.text) + "</div>";
        }).join("");
        return "<div class='raster' style='grid-template-columns:repeat(" + (b.spalten || 1) + ",1fr)'>" + h + "</div>" +
          (b.hinweis ? "<div class='hinweis" + (kreis ? " an" : "") + "'>" + e(b.hinweis) + "</div>" : "");
      }
      case "stationen": {
        const ansicht = zustand.ansicht === "alle" ? b.tische : [zustand.ansicht];
        const h = b.karten.map(st => {
          const zeilen = ansicht.map(t => {
            const k = fb.schluessel(st.nr, t);
            const marke = ansicht.length > 1 ? "<span class='tisch'>" + e(t) + "</span>" : "";
            if (!karten[k]) return "<div class='wartet' data-st='" + k + "'>wartet auf Tisch " + e(t) + " …</div>";
            if (!zustand.freigabe[k]) return "<div class='verdeckt' data-st='" + k + "'>Tisch " + e(t) + " ✓ eingegangen – antippen zum Zeigen</div>";
            return "<div class='zeile' data-st='" + k + "'>" + marke + fb.satzHTML(st, karten[k].werte) + "</div>";
          }).join("");
          return "<div class='karte station" + (ansicht.length > 1 ? " zwei" : "") + "'><div class='kopf'><span>St. " + st.nr + " · " + e(st.titel) + "</span></div>" + zeilen + "</div>";
        }).join("");
        return "<div class='raster stationen-raster' style='grid-template-columns:repeat(" + (b.spalten || 2) + ",1fr)'>" + h + "</div>";
      }
      case "lehrkraft": {
        const teile = b.karten.map((k, i) => {
          const an = !!zustand.lehrkraft[k.id];
          const pf = i > 0 ? "<span class='pf" + (an ? "" : " zu") + "'>" + e(b.pfeil || "→") + "</span>" : "";
          return pf + "<div class='karte lehrkraft" + (an ? "" : " zu") + "' data-lk='" + e(k.id) + "'>" + (an ? e(k.text) : "Karte " + (i + 1) + " (antippen)") + "</div>";
        }).join("");
        return "<div class='kette" + (b.karten.length > 2 ? " lang" : "") + "'>" + teile + "</div>";
      }
    }
    return "";
  }

  function zeichneTafel() {
    const sp = { 1: "", 2: "" };
    baum.bloecke.forEach(b => { sp[b.spalte || 1] += zeichneBlock(b); });
    const kreis = uBlock ? uBlock.karten.some(k => zustand.ursachen[k.id] === "kreis") || Object.keys(zustand.freitext).some(id => zustand.ursachen[id] === "kreis") : false;
    baumEl.innerHTML = "<div class='spalte'>" + sp[1] + "</div><div class='mittelpfeil" + (kreis ? " an" : "") + "'>➜</div><div class='spalte'>" + sp[2] + "</div>";
  }

  // Klassischer Fehlerbaum: Jede Checkfrage beginnt eine Ebene, darunter die Karten.
  function zeichneKlassisch() {
    const e = fb.esc;
    const ebenen = []; let akt = null;
    baum.bloecke.forEach(b => {
      if (b.typ === "check") { akt = { check: b, inhalt: [] }; ebenen.push(akt); }
      else { if (!akt) { akt = { check: null, inhalt: [] }; ebenen.push(akt); } akt.inhalt.push(b); }
    });
    const ansicht = zustand.ansicht === "alle" ? (stBlock.tische || ["A"]) : [zustand.ansicht];
    let h = "<svg id='linien' xmlns='http://www.w3.org/2000/svg'></svg>";
    ebenen.forEach(eb => {
      h += "<div class='kz" + (eb.inhalt.length ? "" : " nurlabel") + "'><div class='klabel'>" + (eb.check ? zeichneBlock(eb.check) : "") + "</div><div class='kinhalt'>";
      eb.inhalt.forEach(b => {
        if (b.typ === "symptom") {
          h += "<div class='karte symptom' data-knoten='symptom'><div class='haupt'>" + e(b.text) + "</div>" + (b.detail ? "<div class='detail'>" + e(b.detail) + "</div>" : "") + "</div>";
        } else if (b.typ === "zweige") {
          h += "<div class='kreihe zweige'>" + b.karten.map(k => "<div class='kzelle'>" + zweigHTML(k, b, true) + "</div>").join("") + "</div>";
        } else if (b.typ === "ursachen") {
          h += "<div class='kreihe'>" + ursachenPlaetze(b).map(k => {
            if (k.leer) return "<div class='kzelle'>" + leerHTML(true) + "</div>";
            const s = zustand.ursachen[k.id] || "";
            return "<div class='kzelle'><div class='karte ursache " + s + (k.frei ? " frei" : "") + "' data-ursache='" + e(k.id) + "' data-knoten='u-" + e(k.id) + "' data-zustand='" + s + "'>" + e(k.text) + "</div>" +
              (b.hinweis && s === "kreis" ? "<div class='hinweis an' data-knoten='hinweis'>" + e(b.hinweis) + "</div>" : "") + "</div>";
          }).join("") + "</div>";
        } else if (b.typ === "stationen") {
          h += "<div class='kreihe st'>" + b.karten.map(st => {
            const zeilen = ansicht.map(t => {
              const k = fb.schluessel(st.nr, t);
              const marke = ansicht.length > 1 ? "<span class='tisch'>" + e(t) + "</span>" : "";
              if (!karten[k]) return "<div class='wartet' data-st='" + k + "'>wartet auf Tisch " + e(t) + " …</div>";
              if (!zustand.freigabe[k]) return "<div class='verdeckt' data-st='" + k + "'>Tisch " + e(t) + " ✓ – antippen</div>";
              return "<div class='zeile' data-st='" + k + "'>" + marke + fb.satzHTML(st, karten[k].werte) + "</div>";
            }).join("");
            return "<div class='kzelle'><div class='karte station" + (ansicht.length > 1 ? " zwei" : "") + "' data-knoten='st-" + st.nr + "'><div class='kopf'><span>St. " + st.nr + " · " + e(st.titel) + "</span></div>" + zeilen + "</div></div>";
          }).join("") + "</div>";
        } else if (b.typ === "lehrkraft") {
          h += "<div class='kreihe lkreihe'>" + b.karten.map((k, i) => {
            const an = !!zustand.lehrkraft[k.id];
            return "<div class='kzelle'><div class='karte lehrkraft" + (an ? "" : " zu") + "' data-lk='" + e(k.id) + "' data-knoten='lk-" + i + "' data-an='" + (an ? 1 : 0) + "'>" + (an ? e(k.text) : "Karte " + (i + 1) + " (antippen)") + "</div></div>";
          }).join("") + "</div>";
        }
      });
      h += "</div></div>";
    });
    baumEl.innerHTML = h;
    requestAnimationFrame(zeichneLinien);
  }

  // Verbindungslinien: senkrecht nach unten, waagerecht verteilen, senkrecht in die Karte (klassische Baumform)
  function zeichneLinien() {
    const svg = document.getElementById("linien");
    if (!svg) return;
    const b0 = baumEl.getBoundingClientRect();
    const box = el => { const r = el.getBoundingClientRect(); return { x: r.left - b0.left + r.width / 2, oben: r.top - b0.top, unten: r.bottom - b0.top }; };
    const alle = sel => Array.from(baumEl.querySelectorAll(sel));
    let pfade = "";
    function verbinde(von, zu, blass) {
      if (!von.length || !zu.length) return;
      const v = von.map(box), z = zu.map(box);
      const unten = Math.max(...v.map(a => a.unten)), oben = Math.min(...z.map(a => a.oben));
      const ym = unten + (oben - unten) / 2;
      const kl = blass ? " class='blass' fill='none' stroke='#cfcfcf' stroke-width='2.5' stroke-dasharray='8 7'" : " fill='none' stroke='#4a4a4a' stroke-width='3' stroke-linejoin='round'";
      v.forEach(a => pfade += "<path" + kl + " d='M" + a.x + " " + a.unten + " V" + ym + "'/>");
      z.forEach(a => pfade += "<path" + kl + " d='M" + a.x + " " + ym + " V" + a.oben + "'/>");
      const xs = v.concat(z).map(a => a.x);
      if (Math.max(...xs) - Math.min(...xs) > 1) pfade += "<path" + kl + " d='M" + Math.min(...xs) + " " + ym + " H" + Math.max(...xs) + "'/>";
    }
    const symptom = alle("[data-knoten=symptom]");
    const ursachen = alle("[data-knoten^='u-']");
    const kreis = ursachen.filter(u => u.dataset.zustand === "kreis");
    const stationen = alle("[data-knoten^='st-']");
    const lk = alle("[data-knoten^='lk-']");
    const uVoll = ursachen.filter(u => u.dataset.zustand !== "leer"), uLeer = ursachen.filter(u => u.dataset.zustand === "leer");
    // Mit Zweigebene (z. B. Zündung | Kompression): Symptom → Zweige, Zweig „weiter“ → Ursachen
    const zweige = alle("[data-knoten^='z-']");
    let oben = symptom, obenBlass = false;
    if (zweige.length) {
      verbinde(symptom, zweige.filter(z => z.dataset.zustand === "leer"), true);
      verbinde(symptom, zweige.filter(z => z.dataset.zustand !== "leer"), false);
      const w = zweige.filter(z => z.dataset.weiter === "1");
      if (w.length) { oben = w; obenBlass = w[0].dataset.zustand === "leer"; }
    }
    verbinde(oben, uLeer, true);
    verbinde(oben, uVoll, obenBlass);
    // Vom eingekreisten Bauteil zu den Stationen; vorher nur blass angedeutet
    const hinweis = alle("[data-knoten=hinweis]");
    if (kreis.length && hinweis.length) { verbinde(kreis, hinweis, false); verbinde(hinweis, stationen, false); }
    else if (kreis.length) verbinde(kreis, stationen, false);

    if (lk.length) verbinde(stationen, [lk[0]], lk[0].dataset.an !== "1");
    // Kette waagerecht: Pfeil von Karte zu Karte („weil …“)
    for (let i = 1; i < lk.length; i++) {
      const a = lk[i - 1].getBoundingClientRect(), c = lk[i].getBoundingClientRect();
      const y = (a.top + a.bottom) / 2 - b0.top, x1 = a.right - b0.left, x2 = c.left - b0.left;
      const kl = lk[i].dataset.an !== "1" ? " class='blass' fill='none' stroke='#cfcfcf' stroke-width='2.5' stroke-dasharray='8 7'" : " fill='none' stroke='#4a4a4a' stroke-width='3' stroke-linejoin='round'";
      pfade += "<path" + kl + " d='M" + x1 + " " + y + " H" + (x2 - 2) + "'/>" +
        "<path" + kl + " d='M" + (x2 - 12) + " " + (y - 7) + " L" + (x2 - 2) + " " + y + " L" + (x2 - 12) + " " + (y + 7) + "'/>";
    }
    svg.innerHTML = pfade;
  }
  window.addEventListener("resize", () => { if (zustand.layout === "klassisch") zeichneLinien(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (zustand.layout === "klassisch") zeichneLinien(); });
  window.addEventListener("beforeprint", () => { if (zustand.layout === "klassisch") zeichneLinien(); });
  // Beim Drucken ändert sich das Layout: Linien für die Druckansicht neu berechnen
  const druckMQ = window.matchMedia("print");
  (druckMQ.addEventListener ? druckMQ.addEventListener.bind(druckMQ, "change") : druckMQ.addListener.bind(druckMQ))(() => { if (zustand.layout === "klassisch") zeichneLinien(); });
  window.addEventListener("afterprint", () => { if (zustand.layout === "klassisch") zeichneLinien(); });

  function zeichnen() {
    baumEl.className = zustand.layout === "tafel" ? "tafel" : "klassisch";
    if (zustand.layout === "tafel") zeichneTafel(); else zeichneKlassisch();
    document.querySelectorAll("#layoutWahl button").forEach(b => b.classList.toggle("aktiv", b.dataset.layout === (zustand.layout === "tafel" ? "tafel" : "klassisch")));
    // Tischwahl
    const tw = document.getElementById("tischWahl");
    const optionen = tische.length > 1 ? tische.concat(["alle"]) : tische;
    tw.innerHTML = optionen.map(t => "<button data-ansicht='" + t + "' class='" + (zustand.ansicht === t ? "aktiv" : "") + "'>" + (t === "alle" ? tische.join("+") : t) + "</button>").join("");
    // Zähler
    const gesamt = stBlock.karten.length * tische.length;
    const da = Object.keys(karten).length;
    const offen = Object.keys(karten).filter(k => !zustand.freigabe[k]).length;
    document.getElementById("zaehler").textContent = da + "/" + gesamt + " Karten" + (offen ? " · " + offen + " noch verdeckt" : "");
  }
  zeichnen();

  // ---------- Bedienung ----------
  baumEl.addEventListener("click", ev => {
    if (ev.target.closest("[data-slot]")) return oeffneAuswahl();
    const zs = ev.target.closest("[data-zweigslot]");
    if (zs) return aufdecken(zs.dataset.zweigslot);
    const u = ev.target.closest("[data-ursache]");
    if (u) {
      const id = u.dataset.ursache, s = zustand.ursachen[id] || "";
      zustand.ursachen[id] = s === "" ? "weg" : s === "weg" ? "kreis" : "";
      return zustandGeaendert();
    }
    const st = ev.target.closest("[data-st]");
    if (st) {
      const k = st.dataset.st;
      if (!karten[k]) return;
      zustand.freigabe[k] = !zustand.freigabe[k];
      return zustandGeaendert();
    }
    const lk = ev.target.closest("[data-lk]");
    if (lk) { zustand.lehrkraft[lk.dataset.lk] = !zustand.lehrkraft[lk.dataset.lk]; return zustandGeaendert(); }
    const c = ev.target.closest("[data-check]");
    if (c) { zustand.checks[c.dataset.check] = !zustand.checks[c.dataset.check]; return zustandGeaendert(); }
  });

  document.getElementById("layoutWahl").addEventListener("click", ev => {
    const b = ev.target.closest("[data-layout]");
    if (b) { zustand.layout = b.dataset.layout; zustandGeaendert(); }
  });
  document.getElementById("tischWahl").addEventListener("click", ev => {
    const b = ev.target.closest("[data-ansicht]");
    if (b) { zustand.ansicht = b.dataset.ansicht; zustandGeaendert(); }
  });

  function qrLink() {
    const q = new URL("qr.html", location.href);
    q.searchParams.set("baum", baumId); q.searchParams.set("s", code);
    const v = fb.param("verbindung", ""); if (v) q.searchParams.set("verbindung", v);
    return q.href;
  }
  document.getElementById("btnQR").onclick = () => window.open(qrLink(), "_blank");

  document.getElementById("btnTest").onclick = async () => {
    if (!confirm("Beispielkarten für alle noch leeren Tische senden? (Karten, die schon da sind, bleiben unverändert.)")) return;
    for (const st of stBlock.karten) for (const t of tische) {
      if (karten[fb.schluessel(st.nr, t)]) continue;
      await verb.senden({ t: "karte", st: st.nr, tisch: t, werte: st.beispiel || {}, zeit: Date.now(), test: true }).catch(() => {});
    }
    melde("Testkarten gesendet");
  };

  async function baumAlsBild() {
    document.body.classList.add("export");
    try { return await htmlToImage.toPng(baumEl, { pixelRatio: 2, backgroundColor: "#ffffff" }); }
    finally { document.body.classList.remove("export"); }
  }

  document.getElementById("btnBild").onclick = async () => {
    try {
      const png = await baumAlsBild();
      const a = document.createElement("a");
      const d = new Date();
      a.download = "Fehlerbaum_" + baumId + "_" + d.toISOString().slice(0, 10) + ".png";
      a.href = png; a.click();
      melde("Bild gespeichert");
    } catch (e) { melde("Bild konnte nicht erzeugt werden – bitte Bildschirmfoto machen"); }
  };

  // Drucken/PDF: genau das Bild vom Beamer auf eine A4-Seite quer
  document.getElementById("btnDruck").onclick = async () => {
    let png;
    try { png = await baumAlsBild(); } catch (e) { return window.print(); }
    const alt = document.getElementById("druckrahmen"); if (alt) alt.remove();
    const f = document.createElement("iframe");
    f.id = "druckrahmen";
    f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
    document.body.appendChild(f);
    const d = f.contentDocument;
    d.open();
    d.write("<!DOCTYPE html><html><head><title>" + fb.esc(baum.titel) + "</title><style>@page{size:A4 landscape;margin:8mm}html,body{margin:0;height:100%}" +
      "body{display:flex;align-items:center;justify-content:center}img{max-width:100%;max-height:100%;object-fit:contain}</style></head><body><img id='b'></body></html>");
    d.close();
    const img = d.getElementById("b");
    img.onload = () => { f.contentWindow.focus(); f.contentWindow.print(); };
    img.src = png;
  };

  document.getElementById("btnVoll").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || function(){}).call(document.documentElement);
  };
  const leiste = (an) => document.body.classList.toggle("ohneLeiste", !an);
  document.getElementById("btnAus").onclick = () => leiste(false);
  document.getElementById("zeigeLeiste").onclick = () => leiste(true);
  document.addEventListener("keydown", ev => {
    if (ev.target.closest && ev.target.closest("input")) { if (ev.key === "Escape") schliesseAuswahl(); return; }
    if (ev.key === "l" || ev.key === "L") leiste(document.body.classList.contains("ohneLeiste"));
    // Zweige per Taste (in der Konfiguration "taste"), z. B. Z = Zündung, K = Kompression
    if (zBlock) {
      const z = zBlock.karten.find(k => k.taste && k.taste.toLowerCase() === ev.key.toLowerCase());
      if (z) { if (zustand.aufgedeckt.includes(z.id)) zuruecknehmen(z.id); else aufdecken(z.id); }
    }
    if (ev.key === "Escape") schliesseAuswahl();
    // Ziffer n: vorbereitete Ursache Nr. n aufdecken bzw. wieder zurücknehmen (für die Klasse unsichtbar)
    if (uBlock && uBlock.aufdecken && /^[1-9]$/.test(ev.key)) {
      const k = uBlock.karten[parseInt(ev.key, 10) - 1];
      if (k) { if (zustand.aufgedeckt.includes(k.id)) zuruecknehmen(k.id); else aufdecken(k.id); }
    }
  });

  function aufdecken(id) {
    if (!zustand.aufgedeckt.includes(id)) zustand.aufgedeckt.push(id);
    zustandGeaendert();
  }
  function zuruecknehmen(id) {
    zustand.aufgedeckt = zustand.aufgedeckt.filter(x => x !== id);
    delete zustand.ursachen[id]; delete zustand.freitext[id];
    zustandGeaendert();
  }

  const auswahl = document.createElement("div");
  auswahl.id = "auswahl";
  document.body.appendChild(auswahl);
  function schliesseAuswahl() { auswahl.classList.remove("an"); }
  function oeffneAuswahl() {
    if (!uBlock) return;
    const e = fb.esc;
    const offen = uBlock.karten.map((k, i) => ({ k, i })).filter(x => !zustand.aufgedeckt.includes(x.k.id));
    const auf = zustand.aufgedeckt.filter(id => ursachenText(id));
    auswahl.innerHTML = "<div class='panel'><h3>Welche Ursache nennt die Klasse?</h3>" +
      "<div class='liste'>" + (offen.length ? offen.map(x => "<button data-auf='" + e(x.k.id) + "'><span class='nr'>" + (x.i + 1) + "</span>" + e(x.k.text) + "</button>").join("") : "<i>Alle vorbereiteten Ursachen sind aufgedeckt.</i>") + "</div>" +
      "<div class='eigen'><input id='eigenText' maxlength='40' placeholder='Eigene Karte (andere Antwort der Klasse)'><button id='eigenOk'>Aufdecken</button></div>" +
      (auf.length ? "<div class='klein'>Schon aufgedeckt – antippen zum Zurücknehmen:</div><div class='liste zurueck'>" + auf.map(id => "<button data-weg='" + e(id) + "'>↺ " + e(ursachenText(id)) + "</button>").join("") + "</div>" : "") +
      "<div class='unten'><button id='auswahlZu'>Abbrechen</button></div></div>";
    auswahl.classList.add("an");
  }
  auswahl.addEventListener("click", ev => {
    if (ev.target === auswahl || ev.target.id === "auswahlZu") return schliesseAuswahl();
    const a = ev.target.closest("[data-auf]"); if (a) { schliesseAuswahl(); return aufdecken(a.dataset.auf); }
    const w = ev.target.closest("[data-weg]"); if (w) { schliesseAuswahl(); return zuruecknehmen(w.dataset.weg); }
    if (ev.target.id === "eigenOk") eigeneKarte();
  });
  auswahl.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "eigenText") eigeneKarte(); });
  function eigeneKarte() {
    const t = (document.getElementById("eigenText").value || "").trim().slice(0, 40);
    if (!t) return;
    const id = "f" + Date.now().toString(36);
    zustand.freitext[id] = t;
    schliesseAuswahl();
    aufdecken(id);
  }

  document.getElementById("btnNeu").onclick = () => {
    if (!confirm("Neue Sitzung starten? Der aktuelle Baum bleibt nur als Bild erhalten (vorher „Bild speichern“). Die QR-Codes ändern sich.")) return;
    const n = new URL(location.href);
    const neu = fb.neuerCode();
    localStorage.setItem(letzteSchl, JSON.stringify({ code: neu, zeit: Date.now() }));
    n.searchParams.set("s", neu);
    location.href = n.href;
  };

  let meldTimer;
  function melde(t) {
    const m = document.getElementById("meldung"); m.textContent = t; m.classList.add("an");
    clearTimeout(meldTimer); meldTimer = setTimeout(() => m.classList.remove("an"), 2500);
  }
})();
</script>
</body>
